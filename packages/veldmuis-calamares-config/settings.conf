---
modules-search: [ local ]

# Weights are expected wall-clock seconds at the ~10 MB/s download rate the
# installer is calibrated for, measured from the Arch package sizes of the
# 2026.11.24 ISO package list. The install is split into phases so the progress
# bar advances through the download instead of sitting on one opaque job.
instances:
  - id: veldmuis-bootstrap-prepare
    module: shellprocess
    config: veldmuis-bootstrap-prepare.conf
    weight: 20
  - id: veldmuis-bootstrap-base
    module: shellprocess
    config: veldmuis-bootstrap-base.conf
    weight: 150
  - id: veldmuis-bootstrap-graphics
    module: shellprocess
    config: veldmuis-bootstrap-graphics.conf
    weight: 60
  - id: veldmuis-bootstrap-extras
    module: shellprocess
    config: veldmuis-bootstrap-extras.conf
    weight: 50
  - id: veldmuis-bootstrap-finalize
    module: shellprocess
    config: veldmuis-bootstrap-finalize.conf
    weight: 40
  - id: veldmuis-boot-finalize
    module: shellprocess
    config: veldmuis-boot-finalize.conf
    weight: 30
  - id: graphics
    module: packagechooser
    config: graphics.conf
  - id: extras
    module: packagechooserq
    config: extras.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - packagechooser@graphics
      - packagechooserq@extras
      - users
      - summary
  - exec:
      - partition
      - mount
      - shellprocess@veldmuis-bootstrap-prepare
      - shellprocess@veldmuis-bootstrap-base
      - shellprocess@veldmuis-bootstrap-graphics
      - shellprocess@veldmuis-bootstrap-extras
      - shellprocess@veldmuis-bootstrap-finalize
      - machineid
      - locale
      - keyboard
      - localecfg
      - fstab
      - initcpiocfg
      - initcpio
      - users
      - networkcfg
      - hwclock
      - services-systemd
      - bootloader
      - shellprocess@veldmuis-boot-finalize
      - umount
  - show:
      - finished

branding: veldmuis
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
