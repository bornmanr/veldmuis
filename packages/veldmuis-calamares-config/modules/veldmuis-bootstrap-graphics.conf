---
dontChroot: true
timeout: 7200
verbose: true

# Both global storage keys must exist when this job runs: Calamares aborts on an
# undefined ${gs[...]} variable. The packagechooser pages always publish a value,
# including the "None" token the extras page writes when nothing is selected.
script:
  - command: "/bin/sh -c '/usr/lib/veldmuis/veldmuis-calamares-bootstrap.sh graphics \"${ROOT}\" \"${gs[packagechooser_graphics]}\" \"${gs[packagechooser_extras]}\" || { [ -f /tmp/veldmuis-calamares-bootstrap.log ] && cat /tmp/veldmuis-calamares-bootstrap.log >&2; exit 1; }'"
    timeout: 7200
    verbose: true

i18n:
  name: "Install graphics drivers"
