---
dontChroot: true
timeout: 7200
verbose: true

# Both global storage keys referenced below must exist when this job runs: Calamares
# aborts the installation on an undefined ${gs[...]} variable. The packagechooser
# pages in settings.conf always publish a defined value, including the "None" token
# the extras page writes when nothing is selected.
script:
  - command: "/bin/sh -c '/usr/lib/veldmuis/veldmuis-calamares-bootstrap.sh \"${ROOT}\" \"${gs[packagechooser_graphics]}\" \"${gs[packagechooser_extras]}\" || { [ -f /tmp/veldmuis-calamares-bootstrap.log ] && cat /tmp/veldmuis-calamares-bootstrap.log >&2; exit 1; }'"
    timeout: 7200
    verbose: true

i18n:
  name: "Bootstrap Veldmuis system"
